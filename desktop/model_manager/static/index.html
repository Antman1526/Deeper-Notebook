<!doctype html>
<html lang="en" data-theme="research-core-dark">
<head>
  <meta charset="utf-8">
  <title>Deeper Notebook — Models</title>
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Load user's chosen theme before first paint to avoid flash.
    (function () {
      fetch('/api/theme')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          document.documentElement.dataset.theme = d.theme || 'research-core-dark';
        })
        .catch(function () { /* keep default */ });
    }());
  </script>
</head>
<body>
  <main>
    <h1>Models</h1>
    <div class="cols">
      <section class="installed">
        <h2>Installed</h2>
        <ul id="installed-list"></ul>
        <p class="hint">Total disk used: <span id="disk-used">0 MB</span></p>
      </section>
      <aside class="recommended">
        <h2>Recommended</h2>
        <div id="catalog"></div>
      </aside>
    </div>
  </main>
  <script src="/static/manager.js"></script>
</body>
</html>
