# Pre-commit hooks for Deeper Notebook (v0.7.120).
#
# Install: `uv run pre-commit install` (one-time; wires .git/hooks/pre-commit)
# Run on all files: `uv run pre-commit run --all-files`
# Update hook versions: `uv run pre-commit autoupdate`
#
# What runs:
#  - ruff check --fix (auto-fix what's mechanical, fail otherwise)
#  - (ruff format is intentionally disabled — see the note by the hook)
#  - check-yaml + check-json (catch syntax errors before commit)
#  - end-of-file-fixer + trailing-whitespace (file hygiene)
#  - check-merge-conflict (catches accidental merge markers)
#  - check-added-large-files (>1 MB by default — keeps the repo lean)
#
# Hooks are scoped to the file types they apply to. Python files only
# go through ruff; YAML/JSON only go through their respective syntax
# checkers. Pytest is NOT in the pre-commit gate (too slow); CI runs
# it instead.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      # v0.8.105 — MEASURED AGAIN, and the earlier reasoning was wrong about
      # WHY. Applying `ruff format` repo-wide (700 files) and re-running the
      # suite gives 5,625 passed / 6 failed, and all six failures are
      # identity-audit tests — not one of the ~469 source-text assertions
      # broke. The blocker is scripts/rebrand-allowlist.json, whose entries are
      # keyed on (path, pattern, source, line, column, context_sha256): a
      # repo-wide reflow invalidates context hashes wholesale and
      # `--regenerate` then aborts with "unclassified occurrence requires
      # explicit review". Re-key that allowlist on content/AST identity and a
      # formatter becomes adoptable; until then this stays off.
      #
      # v0.8.100 — ruff-format is DELIBERATELY NOT ENABLED. It was listed here
      # from v0.7.120 but pre-commit was never installed, so it never ran; the
      # first `pre-commit install` would have rewritten 697 files and broken the
      # build. Measured, not guessed: a trial sweep failed 5 source-shape guards
      # (tests that assert exact source text to pin behaviour that has no other
      # cheap assertion — e.g. "this argv flag is passed to the sidecar").
      #
      # Those guards, not the formatter, are the underlying smell: pinning
      # formatting alongside tokens makes them brittle by construction. Replacing
      # them with behavioural assertions is the real fix and is a project, not a
      # polish-pass edit. Until that happens, a repo-wide reformat costs a broken
      # build and buys cosmetics. `ruff check --fix` above stays — it is
      # compatible and catches actual defects.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
        # Exclude generated locale files (they have trailing semicolons
        # that the formatter normalizes differently than EOL fixer).
        exclude: '^frontend/src/lib/locales/.*/index\.ts$'
      - id: trailing-whitespace
        exclude: '\.md$'   # markdown intentionally uses trailing-space line breaks
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: '^\.gguf$'   # local model weights aren't committed anyway
