<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;
  background:linear-gradient(140deg,#062b2a 0%,#0a4a45 46%,#0d7c74 100%);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#eafaf8;
  display:flex;align-items:center;gap:64px;padding:0 88px;position:relative}
body::after{content:"";position:absolute;inset:0;
  background:radial-gradient(900px 480px at 82% 18%, rgba(18,177,164,.32), transparent 62%);}
img{width:224px;height:224px;border-radius:48px;flex:0 0 auto;position:relative;z-index:1;
  box-shadow:0 26px 70px rgba(0,0,0,.42)}
.t{position:relative;z-index:1}
.kick{font-size:17px;letter-spacing:.3em;text-transform:uppercase;color:#6fc9c0;margin-bottom:20px;font-weight:600}
h1{font-size:78px;line-height:1;letter-spacing:-2px;font-weight:700;margin-bottom:18px}
.sub{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:31px;color:#a8ded9;margin-bottom:30px}
.chips{display:flex;gap:11px;flex-wrap:wrap;max-width:730px}
.chip{font-size:15.5px;padding:8px 16px;border:1px solid rgba(159,222,215,.42);
  border-radius:999px;color:#cdeeea;letter-spacing:.02em}
</style></head><body>
<img src="icon.png" alt="">
<div class="t">
  <div class="kick">Local-first research workspace</div>
  <h1>Deeper Notebook</h1>
  <div class="sub">Think further with every source.</div>
  <div class="chips">
    <span class="chip">Grounded citations</span>
    <span class="chip">Runs fully offline</span>
    <span class="chip">Local models</span>
    <span class="chip">Podcasts &amp; slide decks</span>
    <span class="chip">Obsidian &amp; Logseq</span>
  </div>
</div>
</body></html>
